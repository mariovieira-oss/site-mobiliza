<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobiliza Consultoria</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
  <style>
    :root {
      --bg: #f3f6f2; --fg: #14251b; --muted: #4b5e52;
      --accent: #1f7a4d; --accent-fg: #ffffff; --line: #d5e0d7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1a14; --fg: #e6efe8; --muted: #a3b8aa;
        --accent: #3fb37a; --accent-fg: #0b1a12; --line: #24362b; color-scheme: dark;
      }
    }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Archivo", system-ui, sans-serif; }
    main {
      max-width: 40rem; margin: 0 auto;
      padding: clamp(4rem, 12vw, 8rem) 16px;
      display: flex; flex-direction: column; gap: 1.5rem;
    }
    .selo { margin: 0; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 0; font-size: clamp(3rem, 11vw, 5.5rem); font-weight: 800; line-height: 1; letter-spacing: -0.03em; }
    .frase { margin: 0; font-size: 1.25rem; line-height: 1.55; color: var(--muted); max-width: 32rem; }
    .botao {
      align-self: flex-start; margin-top: 0.5rem;
      background: var(--accent); color: var(--accent-fg);
      font-weight: 600; font-size: 1rem; text-decoration: none;
      padding: 0.9rem 1.6rem; border-radius: 999px;
    }
    .botao:hover { filter: brightness(1.08); }
    .botao:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
    .email { margin: 0; padding-top: 1.5rem; border-top: 1px solid var(--line); font-size: 0.95rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <p class="selo">Consultoria para organizações sociais</p>
    <h1>Mobiliza</h1>
    <p class="frase">Ajudamos organizações sociais a captar recursos, prestar contas com transparência e crescer com estratégia.</p>
    <a class="botao" href="mailto:mario.vieira@mobilizaconsultoria.com.br">Fale com a gente</a>
    <p class="email">Ou escreva para mario.vieira@mobilizaconsultoria.com.br</p>
  </main>
</body>
</html>
